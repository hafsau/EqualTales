# Render Blueprint for EqualTales Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: equaltales-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    # Threads let one worker serve several long-running SSE story streams at once
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300 --workers 2 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ANTHROPIC_API_KEY
        sync: false  # Must be set manually in Render dashboard
      - key: OPENAI_API_KEY
        sync: false  # Must be set manually in Render dashboard
      # Pinned models — change here (or in the dashboard) rather than in code
      - key: CLAUDE_STORY_MODEL
        value: claude-opus-5-5
      - key: CLAUDE_FAST_MODEL
        value: claude-haiku-5-5
      - key: IMAGE_MODEL
        value: gpt-image-1-mini
    healthCheckPath: /api/health
